<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استعراض الملف | قدراتي</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fbf7ef;color:#3f3132}
    header{min-height:68px;padding:12px 5vw;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fffdf9;border-bottom:1px solid #ead9cb}
    h1{margin:0;font-size:20px;color:#915b62}.actions{display:flex;gap:8px;flex-wrap:wrap}
    a,button{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
    .primary{background:#915b62;color:#fff}.secondary{background:#fff;border:1px solid #d9b6ae;color:#78464e}
    main{padding:18px 5vw}.status{margin-bottom:12px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #ead9cb}
    iframe{width:100%;height:calc(100vh - 155px);border:1px solid #ead9cb;border-radius:16px;background:#fff}
    .missing{max-width:720px;margin:10vh auto;background:#fff;padding:34px;border:1px solid #ead9cb;border-radius:20px;text-align:center;box-shadow:0 14px 34px rgba(92,63,62,.1)}
    .missing h2{color:#915b62}.missing code{display:block;direction:ltr;overflow-wrap:anywhere;background:#f7efe7;padding:10px;border-radius:10px}
  </style>
</head>
<body>
<header>
  <h1>استعراض الملف — قدراتي</h1>
  <div class="actions">
    <a class="secondary" href="./">العودة للمنصة</a>
    <a id="openDirect" class="primary" href="#" target="_blank" rel="noreferrer">فتح الملف مباشرة</a>
  </div>
</header>
<main id="content">
  <div class="status" id="status">جارٍ التحقق من الملف…</div>
  <iframe id="viewer" title="استعراض الملف"></iframe>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const file = params.get("file") || "";
  const content = document.getElementById("content");
  const viewer = document.getElementById("viewer");
  const status = document.getElementById("status");
  const direct = document.getElementById("openDirect");

  if (!file) {
    content.innerHTML = '<section class="missing"><h2>لم يتم تحديد ملف</h2><p>ارجعي إلى المنصة واختاري «عرض الملف».</p></section>';
    return;
  }

  const isExternal = /^https?:\/\//i.test(file);
  const safeLocal = file.replace(/^\/+/, "");
  const url = isExternal ? file : safeLocal;
  direct.href = url;
  viewer.src = url;
  status.textContent = "يتم عرض الملف داخل المتصفح. يمكنك أيضًا فتحه مباشرة.";

  if (!isExternal) {
    fetch(url, { method: "HEAD", cache: "no-store" }).then(function(r){
      if (!r.ok) throw new Error("missing");
    }).catch(function(){
      content.innerHTML =
        '<section class="missing"><h2>الملف غير مرفق في النسخة الحالية</h2>' +
        '<p>واجهة الاستعراض جاهزة، لكن ملف PDF نفسه غير موجود في الأرشيف الأصلي. ضعيه داخل <b>public/files</b> بالاسم نفسه ثم أعيدي النشر.</p>' +
        '<code>' + safeLocal.replace(/[&<>"]/g,function(c){var map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"};return map[c]}) + '</code>' +
        '<p><a class="secondary" href="./">العودة إلى المنصة</a></p></section>';
    });
  }
})();
</script>
</body>
</html>
