name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next/static
          test -f out/qodrati-teacher.png
          grep -q '/_next/' out/index.html
          if grep -RIn --include='*.html' --include='*.js' --include='*.css' '/qudurat/_next/' out; then
            echo 'ERROR: Found old /qudurat/_next/ path.' >&2
            exit 1
          fi
          CSS_URL="$(grep -oE 'href="/_next/static/[^"]+\.css"' out/index.html | head -n 1 | cut -d'"' -f2 || true)"
          if [ -n "$CSS_URL" ]; then
            test -f "out${CSS_URL}"
            echo "Verified CSS asset: ${CSS_URL}"
          fi
          echo "Static export verified for custom domain root."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
