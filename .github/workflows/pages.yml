name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      # ضمان عدم معالجة مجلد _next على أنه محتوى Jekyll، حتى لو تغيّر
      # سلوك نسخ الملفات المخفية من public في إصدار مستقبلي من Next.js.
      - name: Ensure no Jekyll processing
        run: touch out/.nojekyll

      - name: Verify static export for custom domain root
        shell: bash
        run: |
          set -euo pipefail

          test -f out/index.html
          test -d out/_next/static
          test -f out/.nojekyll
          test -f out/qodrati-teacher.png

          # يجب أن تكون أصول Next من جذر النطاق: /_next/...
          grep -q '/_next/' out/index.html

          # أي ظهور لمسار المستودع القديم سيكسر CSS/JS على النطاق المخصص.
          if grep -RIn --include='*.html' --include='*.js' --include='*.css' '/qudurat/_next/' out; then
            echo 'ERROR: Found the old /qudurat/_next/ asset path.' >&2
            exit 1
          fi

          # تحقّق فعليًا من أن أول ملف CSS المشار إليه في الصفحة موجود داخل out.
          CSS_URL="$(grep -oE 'href="/_next/static/css/[^"]+\.css"' out/index.html | head -n 1 | cut -d'"' -f2 || true)"
          if [ -z "$CSS_URL" ]; then
            echo 'ERROR: No root-based Next.js CSS URL found in out/index.html.' >&2
            exit 1
          fi
          test -f "out${CSS_URL}"

          echo "Verified CSS asset: ${CSS_URL}"
          echo "Static export is ready for https://qudurat.somaya-mgalad.sa/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
